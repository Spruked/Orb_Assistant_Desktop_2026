system:
  name: "Generic Vault Logic System"
  version: "1.0.0"

resolution:
  strategy: "priority"  # priority | vote | consensus
  default_action: "ignore"

vaults:
  paths:
    - "vaults/**"
  enabled_by_default: true

glyphs:
  thresholds:
    drift_score: 0.5

memory:
  authority: aims                 # single source of truth; see memory/aims_binding.yaml
  binding: memory/aims_binding.yaml
  ttl: 3600s                      # short-term decay is governed by A.I.M.S. (stm_decay_half_life_seconds)